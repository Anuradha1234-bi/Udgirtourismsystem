<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D43"/>
      <stop offset="100%" stop-color="#082A25"/>
    </linearGradient>
    <radialGradient id="terracottaGlowH" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C26D45" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C26D45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGradH)"/>
  <circle cx="300" cy="180" r="160" fill="url(#terracottaGlowH)"/>
  
  <!-- Decorative Rim -->
  <circle cx="300" cy="170" r="76" fill="none" stroke="#FAF8F5" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="300" cy="170" r="64" fill="#0A332D" stroke="#C26D45" stroke-width="2.5"/>

  <!-- Hotel Bed & Key Icon -->
  <g fill="#FAF8F5" transform="translate(300, 170) scale(1.1)">
    <!-- Bed Headboard -->
    <rect x="-24" y="-18" width="6" height="32" rx="2" fill="#FAF8F5"/>
    <!-- Pillow -->
    <rect x="-14" y="-12" width="10" height="8" rx="2" fill="#FAF8F5"/>
    <!-- Mattress & Footboard -->
    <rect x="-14" y="-2" width="36" height="8" rx="2" fill="#FAF8F5"/>
    <rect x="22" y="-10" width="6" height="24" rx="2" fill="#FAF8F5"/>
  </g>

  <!-- Bilingual Label -->
  <text x="300" y="275" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="0.5">Hotel &amp; Lodging</text>
  <text x="300" y="302" font-family="'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="500" fill="#C26D45" text-anchor="middle">हॉटेल व निवास व्यवस्था</text>
  <text x="300" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FAF8F5" fill-opacity="0.6" text-anchor="middle">Verified Local Listing · Udgir</text>
</svg>
