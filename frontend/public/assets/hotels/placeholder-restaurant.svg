<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D43"/>
      <stop offset="100%" stop-color="#082A25"/>
    </linearGradient>
    <radialGradient id="terracottaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C26D45" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C26D45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="160" fill="url(#terracottaGlow)"/>
  
  <!-- Decorative Plate Rim -->
  <circle cx="300" cy="170" r="76" fill="none" stroke="#FAF8F5" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="300" cy="170" r="64" fill="#0A332D" stroke="#C26D45" stroke-width="2.5"/>

  <!-- Fork & Knife Icon -->
  <g fill="#FAF8F5" transform="translate(300, 170) scale(1.1)">
    <!-- Fork -->
    <path d="M-18 -28 v16 c0 4 3 7 7 7 v25 c0 1.5 1.5 2.5 3 2.5 s3 -1 3 -2.5 v-25 c4 0 7 -3 7 -7 v-16 h-3 v14 h-3 v-14 h-2 v14 h-3 v-14 z" fill="#FAF8F5"/>
    <!-- Spoon / Knife -->
    <path d="M12 -28 c0 0 -8 4 -8 18 c0 5 4 9 9 9 v23 c0 1.5 1.5 2.5 3 2.5 s3 -1 3 -2.5 v-50 z" fill="#FAF8F5"/>
  </g>

  <!-- Bilingual Label -->
  <text x="300" y="275" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="0.5">Dining &amp; Cuisine</text>
  <text x="300" y="302" font-family="'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="500" fill="#C26D45" text-anchor="middle">भोजनालय व रेस्टॉरंट</text>
  <text x="300" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500" fill="#FAF8F5" fill-opacity="0.6" text-anchor="middle">Verified Local Listing · Udgir</text>
</svg>
